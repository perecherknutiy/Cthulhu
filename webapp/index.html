<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cthulhu Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">🐙 Cthulhu</div>
    <div class="balance"><span id="balance">—</span> ⭐</div>
  </header>

  <nav id="tabs">
    <button data-tab="games" class="active">Игры</button>
    <button data-tab="wallet">Кошелёк</button>
    <button data-tab="history">История</button>
    <button data-tab="fair">Честность</button>
  </nav>

  <main>
    <!-- ИГРЫ -->
    <section id="tab-games" class="tab active">
      <div class="row"><label>Ставка</label><input id="bet" type="number" min="1" value="10" /></div>
      <div id="game-list" class="chips"></div>

      <div class="game" data-game="dice">
        <div class="row"><label>Число</label><input id="dice-target" type="number" step="0.01" value="50" /></div>
        <div class="row"><label>Направление</label>
          <select id="dice-dir"><option value="under">Меньше</option><option value="over">Больше или равно</option></select></div>
        <button class="primary" data-play="dice">Бросить</button>
      </div>

      <div class="game" data-game="coinflip">
        <div class="row"><label>Сторона</label>
          <select id="coin-side"><option value="heads">Орёл</option><option value="tails">Решка</option></select></div>
        <button class="primary" data-play="coinflip">Подбросить</button>
      </div>

      <div class="game" data-game="limbo">
        <div class="row"><label>Множитель</label><input id="limbo-target" type="number" step="0.01" value="2" /></div>
        <button class="primary" data-play="limbo">Играть</button>
      </div>

      <div class="game" data-game="plinko">
        <div class="row"><label>Ряды</label><input id="plinko-rows" type="number" min="8" max="16" value="12" /></div>
        <div class="row"><label>Риск</label>
          <select id="plinko-risk"><option>low</option><option selected>medium</option><option>high</option></select></div>
        <div id="plinko-table" class="muted small"></div>
        <button class="primary" data-play="plinko">Бросить шар</button>
      </div>

      <div class="game" data-game="mines">
        <div class="row"><label>Мин</label><input id="mines-count" type="number" min="1" max="24" value="3" /></div>
        <div id="mines-grid" class="grid"></div>
        <div class="row">
          <button class="primary" id="mines-start">Начать</button>
          <button id="mines-cashout">Забрать</button>
        </div>
      </div>

      <div id="result" class="result"></div>
    </section>

    <!-- КОШЕЛЁК -->
    <section id="tab-wallet" class="tab">
      <h3>Пополнить</h3>
      <div id="deposit-presets" class="chips"></div>
      <h3>Вывести</h3>
      <div class="muted small" id="wager-info"></div>
      <div class="row"><input id="withdraw-amount" type="number" placeholder="Сумма" /><button id="withdraw-btn">Вывести</button></div>
      <h3>Пригласить друга</h3>
      <div class="row"><input id="ref-link" readonly /><button id="ref-copy">📋</button></div>
      <div class="muted small" id="ref-info"></div>
      <h3>Операции</h3>
      <ul id="tx-list" class="list"></ul>
    </section>

    <!-- ИСТОРИЯ -->
    <section id="tab-history" class="tab">
      <ul id="bet-list" class="list"></ul>
    </section>

    <!-- ЧЕСТНОСТЬ -->
    <section id="tab-fair" class="tab">
      <p class="small muted">Хэш server seed известен заранее. После смены пары сид раскрывается — любую ставку можно пересчитать:
        HMAC_SHA256(server_seed, "client_seed:nonce:cursor").</p>
      <div class="kv"><b>Server seed hash</b><code id="fair-hash"></code></div>
      <div class="kv"><b>Client seed</b><code id="fair-client"></code></div>
      <div class="kv"><b>Nonce</b><code id="fair-nonce"></code></div>
      <div class="row"><input id="fair-new-client" placeholder="Новый client seed (необязательно)" /></div>
      <button id="fair-rotate">Сменить пару и раскрыть старый сид</button>
      <pre id="fair-revealed" class="small"></pre>
    </section>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
