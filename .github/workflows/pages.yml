# Публикует папку webapp/ (фронт мини-приложения) на GitHub Pages при каждом пуше в main.
#
# Один раз перед первым запуском: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Без этого шаг configure-pages падает с ошибкой «Get Pages site failed … Not Found».
# На бесплатном плане GitHub Pages работает только для публичных репозиториев.
name: Deploy webapp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
